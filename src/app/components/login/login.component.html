<div class="flex min-h-screen bg-gray-950">
  <!-- Lado izquierdo: imagen (solo desktop) -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
    <img src="assets/img/jpg/mikasa.jpg" alt="tattoo art" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-r from-transparent to-gray-950"></div>
    <div class="absolute inset-0 bg-gray-950/30"></div>
    <div class="relative z-10 flex flex-col justify-end p-12">
      <h2 class="text-4xl font-bold text-white leading-tight">El arte<br>en tu piel</h2>
      <p class="mt-3 text-gray-300 text-lg max-w-sm">Cada tatuaje cuenta una historia. Dejanos ser parte de la tuya.</p>
    </div>
  </div>

  <!-- Lado derecho: formulario -->
  <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
    <!-- Glow decorativo -->
    <div class="absolute top-1/4 right-1/4 w-72 h-72 bg-red-500/8 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-sm">
      <!-- Logo -->
      <div class="flex justify-center mb-10">
        <div class="bg-white rounded-2xl p-5 shadow-lg shadow-red-500/10">
          <img src="assets/img/webp/morphine-logo.webp" alt="morphine" class="w-44">
        </div>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-400 mb-1.5">Correo electronico</label>
          <input type="text" formControlName="username"
                class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                placeholder="ejemplo@correo.com"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': username?.invalid && username?.touched}">
          <div *ngIf="username?.invalid && username?.touched" class="text-red-400 text-xs mt-1.5">
            <div *ngIf="username?.errors?.['required']">El correo es requerido.</div>
            <div *ngIf="username?.errors?.['email']">Ingrese un correo valido.</div>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-400 mb-1.5">Contrasena</label>
          <input type="password" formControlName="password"
                class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': password?.invalid && password?.touched}">
          <div *ngIf="password?.invalid && password?.touched" class="text-red-400 text-xs mt-1.5">
            <div *ngIf="password?.errors?.['required']">La contrasena es requerida.</div>
            <div *ngIf="password?.errors?.['minlength']">La contrasena debe tener al menos 6 caracteres.</div>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading"
                class="w-full py-3.5 rounded-xl font-semibold text-white bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 shadow-lg shadow-red-500/20 hover:shadow-red-500/30 focus:ring-4 focus:ring-red-500/20 transition-all duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
          <ng-container *ngIf="!isLoading">Ingresar</ng-container>
          <ng-container *ngIf="isLoading">
            <svg class="animate-spin h-5 w-5 mr-3 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Cargando...
          </ng-container>
        </button>
      </form>

      <p class="text-center text-gray-600 text-xs mt-8">M O R P H I N E &mdash; Tattoo Studio</p>
    </div>
  </div>
</div>
