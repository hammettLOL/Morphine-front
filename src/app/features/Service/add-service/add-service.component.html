<!-- src/app/components/add-customer/add-customer.component.html -->
<div class="container mx-auto p-4 relative">
    <!-- Glow decorative -->
    <div class="absolute top-20 right-10 w-72 h-72 bg-red-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="mb-6">
      <div class="inline-block mb-2 px-3 py-1 rounded-full bg-red-500/10 text-red-400 text-xs font-semibold tracking-widest uppercase">SERVICIOS</div>
      <h1 class="text-2xl font-bold text-gray-100">Agregar Servicio</h1>
    </div>
    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" class="bg-gray-900/80 backdrop-blur-sm p-6 rounded-2xl shadow-lg shadow-gray-900/50">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-1 h-5 bg-red-500 rounded-full"></div>
        <h3 class="text-lg font-semibold text-gray-100">Datos del Servicio</h3>
      </div>
      <div class="mb-4">
        <label for="type" class="block text-sm font-medium text-gray-400 mb-1.5">Tipo</label>
        <input id="type" formControlName="type" type="text" placeholder="Ingrese el tipo"
               class="w-full p-2 border border-gray-700/50 rounded-xl bg-gray-800/50 text-gray-100"
               [ngClass]="{'border-red-500': serviceForm.get('type')?.invalid && serviceForm.get('type')?.touched}"
        />
        <div *ngIf="serviceForm.get('type')?.invalid && serviceForm.get('type')?.touched" class="text-red-500 text-sm mt-1">
          El tipo es requerido.
        </div>
      </div>
      <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-400 mb-1.5">Descripcion</label>
        <input id="description" formControlName="description" type="text" placeholder="Ingrese la Descripcion"
               class="w-full p-2 border border-gray-700/50 rounded-xl bg-gray-800/50 text-gray-100"
               [ngClass]="{'border-red-500': serviceForm.get('description')?.invalid && serviceForm.get('description')?.touched}"
        />
        <div *ngIf="serviceForm.get('description')?.invalid && serviceForm.get('description')?.touched" class="text-red-500 text-sm mt-1">
          La descripcion es requerida.
        </div>
      </div>
      <div class="flex flex-col sm:flex-row justify-between gap-2 mt-4">
        <button type="submit" class="flex-1 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white py-2 rounded-xl shadow-lg shadow-red-500/20 font-medium transition">
          Agregar Servicio
        </button>
        <button type="button" class="flex-1 bg-gray-800/50 text-gray-300 py-2 rounded-xl hover:bg-gray-600 transition"
          (click)="cancel()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
