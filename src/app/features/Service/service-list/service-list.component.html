<div class="container mx-auto p-4 relative">
    <!-- Glow decorative -->
    <div class="absolute top-20 right-10 w-72 h-72 bg-red-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
      <div>
        <div class="inline-block mb-2 px-3 py-1 rounded-full bg-red-500/10 text-red-400 text-xs font-semibold tracking-widest uppercase">SERVICIOS</div>
        <h1 class="text-2xl font-bold text-gray-100">Lista de Servicios</h1>
      </div>
      <button (click)="addService()"
              class="mt-4 md:mt-0 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white px-4 py-2 rounded-xl shadow-lg shadow-red-500/20 font-medium transition">
        Agregar Servicio
      </button>
    </div>

    <!-- Vista en Tarjetas para dispositivos pequenos -->
    <div class="block sm:hidden">
      <div class="space-y-4">
        <div *ngFor="let service of services; trackBy: trackByServiceId" class="bg-gray-900/80 backdrop-blur-sm p-4 rounded-2xl shadow-lg shadow-gray-900/50 border border-gray-800/50">
          <div class="mb-1 text-gray-100">
            <span class="font-bold">Tipo:</span> {{ service.type }}
          </div>
          <div class="mb-1 text-gray-100">
            <span class="font-bold">Descripcion:</span> {{ service.description }}
          </div>
          <!-- Acciones -->
          <div class="mt-2 flex space-x-2">
            <button (click)="editService(service)"
                    class="flex-1 bg-green-900/30 text-green-400 py-1 rounded-xl hover:bg-green-800/50 transition">
              Editar
            </button>
            <button (click)="deleteService(service)"
                    class="flex-1 bg-red-900/30 text-red-400 py-1 rounded-xl hover:bg-red-800/50 transition">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Vista en Tabla para pantallas medianas y superiores -->
    <div class="hidden sm:block overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-700 border border-gray-800/50 rounded-2xl overflow-hidden">
        <thead class="bg-gray-800/50">
          <tr>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Tipo</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Descripcion</th>
            <th class="px-4 py-2 text-center text-xs font-medium text-gray-400 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-gray-900/80 divide-y divide-gray-700">
          <tr *ngFor="let service of services; trackBy: trackByServiceId" class="text-gray-100 hover:bg-gray-800/50 hover:border-l-2 hover:border-red-500 transition-colors duration-150">
            <td class="px-4 py-2 whitespace-nowrap">{{ service.type }}</td>
            <td class="px-4 py-2 whitespace-nowrap">{{ service.description }}</td>
            <td class="px-4 py-2 whitespace-nowrap text-center space-x-2">
              <button (click)="editService(service)"
                      class="bg-green-900/30 text-green-400 py-1 px-3 rounded-xl hover:bg-green-800/50 transition">
                Editar
              </button>
              <button (click)="deleteService(service)"
                      class="bg-red-900/30 text-red-400 py-1 px-3 rounded-xl hover:bg-red-800/50 transition">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginacion (visible en todas las vistas) -->
    <div class="flex justify-center mt-4">
      <button (click)="prevPage()"
              [disabled]="pageNumber === 1"
              class="px-4 py-2 bg-gray-800/50 border border-gray-700/50 text-gray-300 rounded-xl disabled:opacity-50 mr-2 hover:bg-gray-800/50 transition">
        Anterior
      </button>
      <span class="self-center text-gray-100">Pagina {{ pageNumber }}</span>
      <button (click)="nextPage()"
              class="px-4 py-2 bg-gray-800/50 border border-gray-700/50 text-gray-300 rounded-xl ml-2 hover:bg-gray-800/50 transition">
        Siguiente
      </button>
    </div>
  </div>
