<aside id="logo-sidebar"
       class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform bg-gray-950/95 backdrop-blur-md border-r border-gray-800/50"
       [ngClass]="{'-translate-x-full': !isOpen, 'translate-x-0': isOpen}">
  <div class="h-full px-3 pb-4 overflow-y-auto flex flex-col">
    <!-- Menu items -->
    <ul class="space-y-1.5 font-medium flex-1 mt-2">
      <li *ngFor="let item of visibleMenuItems">
        <a [routerLink]="item.route"
           routerLinkActive="bg-red-500/10 text-red-400 border-l-2 border-red-500"
           (click)="onClose()"
           class="flex items-center px-3 py-2.5 text-gray-400 rounded-xl hover:bg-gray-800 hover:text-gray-100 transition-all duration-200 group border-l-2 border-transparent">
          <svg class="shrink-0 w-5 h-5 text-gray-500 transition duration-200 group-hover:text-red-400"
               [class.text-red-400]="false"
               aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
               [attr.viewBox]="item.route === '/customers' ? '0 0 20 18' : item.route === '/work-orders' ? '0 0 18 20' : item.route === '/accounting' ? '0 0 18 18' : '0 0 22 21'"
               [innerHTML]="item.icon">
          </svg>
          <span class="flex-1 ms-3 whitespace-nowrap text-sm">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <!-- Separator -->
    <div class="border-t border-gray-800/50 mx-2 my-2"></div>

    <!-- Logout -->
    <a (click)="onLogout()"
       class="flex items-center px-3 py-2.5 text-gray-500 rounded-xl hover:bg-red-500/10 hover:text-red-400 transition-all duration-200 group cursor-pointer mb-4">
      <svg class="shrink-0 w-5 h-5 text-gray-600 transition duration-200 group-hover:text-red-400"
           aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 16">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/>
      </svg>
      <span class="flex-1 ms-3 whitespace-nowrap text-sm">Cerrar sesion</span>
    </a>
  </div>
</aside>
